# Render Blueprint: New > Blueprint > pick this repo. Creates KGL's app and its own database.
# Values marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: kgl-crm
    runtime: docker
    rootDir: crm
    dockerfilePath: ./Dockerfile
    plan: starter            # always on; free instances sleep and would stall campaigns
    region: frankfurt        # closest Render region to Lagos
    numInstances: 1          # the campaign sender runs in-process: keep ONE instance
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kgl-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://crm.kamilightglobal.com
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true

databases:
  - name: kgl-db
    databaseName: kgl
    plan: basic-256mb
    region: frankfurt
