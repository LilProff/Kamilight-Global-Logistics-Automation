# Render Blueprint: New > Blueprint > pick this repo. Creates KGL's always-on app.
# The database lives on Supabase (free plan). Values marked sync: false are typed into the
# Render dashboard, never committed.
services:
  - type: web
    name: kgl-crm
    runtime: docker
    dockerfilePath: ./crm/Dockerfile
    dockerContext: ./crm
    plan: free               # $0. Free instances sleep after 15 min idle; a pg_cron job in Supabase pings
                             # /healthz every 5 min to keep it awake (see crm/docs/RUNBOOK.md).
                             # Upgrade trigger: change to `starter` ($7) for a guaranteed always-on instance
    region: frankfurt        # closest Render region to Lagos
    numInstances: 1          # the campaign sender runs in-process: keep ONE instance
    healthCheckPath: /health
    envVars:
      # Supabase > Project Settings > Database > Connection string > Session pooler
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
